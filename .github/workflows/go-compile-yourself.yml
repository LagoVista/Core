name: Go Compile Yourself

on:
  push:
    branches:
      - 'feature/**'
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: Package version to build
        required: true
        type: string
        default: 5.0.0
      publish:
        description: Publish the package to the shared GitHub Packages feed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-package:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref == 'refs/heads/master' && '5.0.0' || format('5.0.0-feature.{0}', github.run_number) }}
      PACKAGE_SOURCE: https://nuget.pkg.github.com/nuviot/index.json
      NUGET_GITHUB_TOKEN: ${{ secrets.NUGET_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Configure shared package feed
        if: ${{ env.NUGET_GITHUB_TOKEN != '' }}
        shell: pwsh
        run: |
          dotnet nuget remove source nuviot 2>$null
          dotnet nuget add source "$env:PACKAGE_SOURCE" `
            --name nuviot `
            --username "${{ github.actor }}" `
            --password "$env:NUGET_GITHUB_TOKEN" `
            --store-password-in-clear-text

      - name: Build and pack repository packages
        shell: pwsh
        run: ./Build-GitHubPackages.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload package build
        uses: actions/upload-artifact@v4
        with:
          name: LagoVista.Core-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/packages/LagoVista.Core.${{ env.PACKAGE_VERSION }}.nupkg
            artifacts/package-catalog.json
          if-no-files-found: error

      - name: Verify shared-feed restore
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'Verify LagoVista.Core 5.0.0 restore' }}
        shell: pwsh
        run: |
          dotnet nuget locals all --clear

          $smoke = Join-Path $env:RUNNER_TEMP 'lagovista-core-restore-smoke'
          if (Test-Path $smoke) {
            Remove-Item -Recurse -Force $smoke
          }

          dotnet new classlib --framework net9.0 --output $smoke --force
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create restore smoke project with exit code $LASTEXITCODE."
          }

          $project = Join-Path $smoke 'lagovista-core-restore-smoke.csproj'
          dotnet add $project package LagoVista.Core --version $env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to add LagoVista.Core $env:PACKAGE_VERSION from configured package sources."
          }

          dotnet restore $project --force --no-cache
          if ($LASTEXITCODE -ne 0) {
            throw "Fresh restore failed with exit code $LASTEXITCODE."
          }

          $assets = Join-Path $smoke 'obj/project.assets.json'
          $expected = 'lagovista.core/5.0.0'
          if (-not (Select-String -Path $assets -Pattern $expected -SimpleMatch -Quiet)) {
            throw "Restore completed but $expected was not present in project.assets.json."
          }

          Write-Host 'Fresh restore of LagoVista.Core 5.0.0 from the shared package configuration succeeded.'

      - name: Publish package
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'Publish LagoVista.Core 5.0.0 canary') }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_GITHUB_TOKEN)) {
            throw 'NUGET_GITHUB_TOKEN is required when publish=true.'
          }

          $package = "artifacts/packages/LagoVista.Core.$env:PACKAGE_VERSION.nupkg"
          dotnet nuget push $package `
            --source nuviot `
            --api-key "$env:NUGET_GITHUB_TOKEN" `
            --skip-duplicate

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish '$package'."
          }
