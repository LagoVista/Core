name: Go Compile Yourself

on:
  push:
    branches:
      - 'feature/**'
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: Package version to build
        required: true
        type: string
        default: 5.0.0
      publish:
        description: Publish repository packages to the shared GitHub Packages feed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-package:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref == 'refs/heads/master' && '5.0.0' || format('5.0.0-feature.{0}', github.run_number) }}
      PACKAGE_SOURCE: https://nuget.pkg.github.com/nuviot/index.json
      NUGET_GITHUB_TOKEN: ${{ secrets.NUGET_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Configure shared package feed
        if: ${{ env.NUGET_GITHUB_TOKEN != '' }}
        shell: pwsh
        run: |
          dotnet nuget remove source nuviot 2>$null
          dotnet nuget add source "$env:PACKAGE_SOURCE" `
            --name nuviot `
            --username "${{ github.actor }}" `
            --password "$env:NUGET_GITHUB_TOKEN" `
            --store-password-in-clear-text

      - name: Build and pack repository packages
        shell: pwsh
        run: ./Build-GitHubPackages.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload package build
        uses: actions/upload-artifact@v4
        with:
          name: Core-package-set-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/package-catalog.json
          if-no-files-found: error

      - name: Publish packages
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'Publish Core TestBase 5.0.0') }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_GITHUB_TOKEN)) {
            throw 'NUGET_GITHUB_TOKEN is required when publish=true.'
          }

          $packages = @(Get-ChildItem artifacts/packages -Filter '*.nupkg' -File | Where-Object { $_.Name -notlike '*.symbols.nupkg' } | Sort-Object Name)
          if ($packages.Count -eq 0) {
            throw 'No packages were produced for publishing.'
          }

          foreach ($package in $packages) {
            Write-Host "Publishing $($package.Name)"
            dotnet nuget push $package.FullName `
              --source nuviot `
              --api-key "$env:NUGET_GITHUB_TOKEN" `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish '$($package.Name)'."
            }
          }

      - name: Verify published package restores
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'Publish Core TestBase 5.0.0') }}
        shell: pwsh
        run: |
          dotnet nuget locals all --clear

          $catalog = Get-Content artifacts/package-catalog.json -Raw | ConvertFrom-Json
          foreach ($package in $catalog.packages) {
            $safeName = ($package.id -replace '[^A-Za-z0-9_.-]', '_')
            $smoke = Join-Path $env:RUNNER_TEMP "restore-$safeName"
            if (Test-Path $smoke) {
              Remove-Item -Recurse -Force $smoke
            }

            dotnet new classlib --framework net9.0 --output $smoke --force | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create restore project for $($package.id)."
            }

            $project = Get-ChildItem $smoke -Filter '*.csproj' -File | Select-Object -First 1
            dotnet add $project.FullName package $package.id --version $package.version
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to restore $($package.id) $($package.version) from configured package sources."
            }

            $assets = Join-Path $smoke 'obj/project.assets.json'
            $expected = "$($package.id)/$($package.version)".ToLowerInvariant()
            if (-not (Select-String -Path $assets -Pattern $expected -SimpleMatch -Quiet)) {
              throw "Restore completed but $expected was not present in project.assets.json."
            }

            Write-Host "Verified $($package.id) $($package.version)"
          }
